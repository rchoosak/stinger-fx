[project]
name = "stinger-fx"
version = "1.4.0"
description = "EA Bot Platform — multi-strategy Forex trading on MT5/MT4 with backtesting and hot-reloadable config"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Choosak Rangmai" }]
dependencies = [
    # Core
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "anyio>=4.4",
    "orjson>=3.10",
    # CLI / UI
    "typer>=0.12",
    "rich>=13.7",
    "textual>=0.79",
    # Web UI
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    # Config / logging
    "pyyaml>=6.0",
    "watchdog>=4.0",
    "structlog>=24.4",
    # Data
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "pyarrow>=17.0",
    "pandas>=2.2",
    # Backtest / IPC
    "pyzmq>=26.0",
    # Numeric
    "numpy>=1.26",
    # Observability
    "prometheus-client>=0.20",
    # Notifications
    "httpx>=0.27",
]

[project.optional-dependencies]
mt5 = [
    "MetaTrader5>=5.0.45; sys_platform == 'win32'",
]
optimize = [
    "optuna>=3.5",                          # Bayesian (TPE) parameter sweep
]
pairs = [
    "statsmodels>=0.14",                    # ADF test for Engle-Granger cointegration
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",                          # for FastAPI TestClient
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
    "optuna>=3.5",                          # tests for OptunaSearch
]

[project.scripts]
stinger-fx = "stinger_fx.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stinger_fx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "mt5: integration tests that require MetaTrader5 (Windows only)",
    "slow: tests that take more than 1 second",
]

[tool.coverage.run]
source = ["src/stinger_fx"]
branch = true
