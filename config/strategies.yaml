# Active strategies. Each entry is hot-reloadable:
#   • params changes      → live swap (calls on_params_reloaded)
#   • add new entry       → strategy starts
#   • set enabled: false  → strategy stops gracefully
#   • change class_path   → old stops, new starts (no state migration)

strategies:
  - id: ma_eurusd_m15
    class_path: stinger_fx.strategies.examples.ma_crossover:MACrossover
    enabled: true
    params:
      fast: 10
      slow: 30
      volume: 0.01

  # Backtest-only entry for the May-2026 XAUUSD tick replay
  # (`stinger-fx backtest run --run-id xauusd_may2026`).  ``enabled: false``
  # keeps it out of the live engine — the backtester loads the strategy
  # by id directly and ignores this flag.
  - id: orb_xauusd_may2026
    class_path: stinger_fx.strategies.examples.opening_range_breakout:OpeningRangeBreakout
    enabled: false
    params:
      symbol: XAUUSD
      entry_timeframe: M1
      structure_timeframe: M5
      # London-open ORB defaults from the strategy spec — proven on XAU.
      session_start_hour_utc: 7
      session_end_hour_utc: 16
      opening_range_minutes: 15
      atr_period: 14
      breakout_buffer_atr: 0.1
      stop_buffer_atr: 0.3
      min_or_range_atr: 0.5
      max_or_range_atr: 3.0
      sl_mode: opposite_or
      tp_mode: or_range
      min_rr: 0.8
      volume: 0.01
      max_trades_per_session: 1

  # Pullback Reversal Scalper — M1 Stoch RSI + RSI entries with M5 trend
  # filter.  Buys pullbacks inside an M5 uptrend (M5 RSI < 50) when M1
  # goes deeply oversold and Stoch RSI K crosses up out of the OS zone;
  # symmetric for sells in an M5 downtrend.  Exits fast on M1 Stoch RSI
  # K crossing the opposite extreme.  All thresholds / TFs configurable.
  # `enabled: false` keeps it out of live mode — backtest path loads by
  # id and ignores the flag.
  - id: prs_scalper_xau
    class_path: stinger_fx.strategies.examples.pullback_reversal_scalper:PullbackReversalScalper
    enabled: false
    params:
      symbol: XAUUSD
      entry_timeframe: M1
      structure_timeframe: M5
      # M5 trend filter — OFF by default.  When false, every M5 gate
      # below (EMA, RSI, HH/HL) is skipped and the strategy fires on
      # M1 RSI + Stoch RSI extremes alone.  Flip to `true` for the
      # original strict pullback-with-trend behavior.
      use_m5_filter: false
      ema_fast_period: 20
      ema_slow_period: 50
      m5_rsi_period: 14
      m5_rsi_buy_max: 50.0      # BUY requires m5_rsi < this (uptrend pullback)
      m5_rsi_sell_min: 50.0     # SELL requires m5_rsi > this (downtrend bounce)
      swing_lookback: 5         # HH/HL: compare to bar `swing_lookback` ago
      # M1 entry triggers
      m1_rsi_period: 14
      # 20/80 (deep extremes) gave a positive edge on the May-1 XAU smoke
      # (+10.96, PF 2.22) vs 30/70 which overtraded weak setups (-25, PF
      # 0.72). Loosening to "fire more often" trades quality for quantity —
      # the extra entries were mostly counter-trend SELLs that hit SL fast.
      m1_rsi_oversold: 20.0
      m1_rsi_overbought: 80.0
      stoch_rsi_period: 14
      stoch_rsi_k_smooth: 3
      stoch_rsi_d_smooth: 3
      stoch_rsi_oversold: 20.0
      stoch_rsi_overbought: 80.0
      # Exits
      stoch_rsi_exit_long: 80.0
      stoch_rsi_exit_short: 20.0
      # Risk + sizing
      volume: 0.01
      atr_period: 14
      sl_atr_mult: 1.0
      tp_atr_mult: 0.0          # 0 = no fixed TP — rely on Stoch RSI exit
      max_hold_bars_m1: 30      # safety time stop
      cooldown_bars_m1: 2       # bars after close before next entry
      # Trailing stop loss (optional, default OFF for backward compat).
      # When enabled, attaches a TrailingStopManager on each entry that
      # ratchets the SL behind price as the trade moves in our favour.
      enable_trailing: false
      trailing_distance_atr: 0.8  # SL stays this many ATR behind price
      trailing_activate_atr: 0.5  # activate trail after this much profit (ATR)
      trailing_point: 0.01        # XAU point — change to 0.0001 for FX

  # Momentum Breakout Scalper — M1 Donchian breakout + M5 EMA trend
  # filter, with two risk gates the PRS sweep showed were the missing
  # structural levers: a session-avoid list (skips London-PM / NY-open
  # spike windows) and a True-Range vol gate (skips spike candles).
  # Exits via fixed `tp_atr_mult × ATR` TP + `sl_atr_mult × ATR` SL,
  # with a time-stop safety net. `enabled: false` keeps it out of live
  # mode — backtest path loads by id and ignores the flag.
  - id: mbs_xauusd
    class_path: stinger_fx.strategies.examples.momentum_breakout_scalper:MomentumBreakoutScalper
    enabled: false
    params:
      symbol: XAUUSD
      entry_timeframe: M1
      structure_timeframe: M5
      # Breakout entry — Donchian on M1 (prior N bars excluded current)
      donchian_period: 20
      # M5 trend filter — when True, BUY requires EMA-fast > EMA-slow.
      require_m5_trend: true
      ema_fast_period: 20
      ema_slow_period: 50
      # Session avoidance — skip these UTC hours where PRS worst losses
      # clustered (13:00–15:00 London PM, 18:00 NY mid).
      avoid_hours_utc: [13, 14, 15, 18]
      # Volatility gate — skip when current TR > mult × SMA(TR, lookback)
      vol_gate_lookback: 50
      # Sweep `mbs_xau_donchian_vol` showed 1.5 is the marginal best
      # by a wide margin: vol_mult 1.5/2.0/3.0 → mean PnL −44/−82/−138.
      vol_gate_mult: 1.5
      # Risk + sizing
      volume: 0.01
      atr_period: 14
      sl_atr_mult: 1.0
      tp_atr_mult: 1.5
      max_hold_bars_m1: 30
      cooldown_bars_m1: 5
      # Trailing (optional, default OFF)
      enable_trailing: false
      trailing_distance_atr: 0.8
      trailing_activate_atr: 0.5
      trailing_point: 0.01

  # Multi-Timeframe Confluence Scalper — fires only when M15, M5, AND
  # M1 all agree.  M15 + M5 EMA-fast/slow define trend direction; M1
  # RSI oversold/overbought picks the entry timing inside the bigger
  # trend.  Selective by design — 3-8 trades/day on XAU, much lower
  # spread cost per dollar of P&L than MBS/OFIS.  `enabled: false` —
  # backtest path loads by id and ignores the flag.
  - id: mtc_xauusd
    class_path: stinger_fx.strategies.examples.multi_tf_confluence_scalper:MultiTFConfluenceScalper
    enabled: false
    params:
      symbol: XAUUSD
      entry_timeframe: M1
      mid_timeframe: M5
      high_timeframe: M15
      # M5 trend filter
      m5_ema_fast: 20
      m5_ema_slow: 50
      # M15 trend filter — longer lookbacks so it adds genuine
      # bigger-picture information vs M5.
      m15_ema_fast: 21
      m15_ema_slow: 55
      # M1 pullback trigger.  30/70 is the empirical sweet spot on XAU
      # M1 (cross-up smoke, 4-day window):
      #   35 → 35 trades, win 20%, -44.64  (floods on noise pullbacks)
      #   30 → 12 trades, win 33%,  -2.68  (best balance) ←
      #   25 →  2 trades, win  0%,  -4.36  (starved)
      #   20 →  1 trade,  win  0%,  -2.68  (starved)
      # Shallower drowns in fake dips; deeper starves (RSI(14) rarely
      # reaches <25 here because in-trend pullbacks are shallow).
      m1_rsi_period: 14
      m1_rsi_oversold: 30.0
      m1_rsi_overbought: 70.0
      # Session + vol gates (reused from MBS winner)
      avoid_hours_utc: [13, 14, 15, 18]
      vol_gate_lookback: 50
      vol_gate_mult: 1.5
      # Risk — confirmed by sweep `mtc_xau_risk_exits` (18 cells, full
      # week May 22-30): this exact combo is the #1 cell at +3.12 net /
      # PF 1.14 / 20 trades.  Marginals match MBS round-2 exactly:
      #   tp_atr_mult  1.0→2.0 monotonic (+7.9 net) — 2:1 RR dominates
      #   sl_atr_mult  peaks at 1.0 (0.7 too tight, 1.5 too wide)
      #   trailing     OFF beats ON (it clips winners before the 2:1 TP)
      # NB the 4-day smoke shows -2.68 — that's small-sample variance;
      # the full week is solidly positive.
      volume: 0.01
      atr_period: 14
      sl_atr_mult: 1.0
      tp_atr_mult: 2.0
      max_hold_bars_m1: 30
      cooldown_bars_m1: 5
      enable_trailing: false
      trailing_distance_atr: 0.8
      trailing_activate_atr: 0.5
      trailing_point: 0.01

  # Order-Flow Imbalance Scalper — RETAIL APPROXIMATION of institutional
  # HFT OFI.  Uses Dukascopy quote ticks (no aggressor flag) + the
  # quote-mid shift rule to attribute signed volume to buyer/seller
  # pressure.  Academic literature reports ~30-40% misclassification on
  # this proxy vs ground truth, so realistic expectations are 45-55%
  # win rate / RR 1-1.5:1 — not the 65-75% × 2:1 of true HFT.
  #
  # Non-OFI knobs (session/vol/risk) mirror the winning MBS round-2
  # combo so an A/B test isolates the impact of the OFI signal itself.
  - id: ofis_xauusd
    class_path: stinger_fx.strategies.examples.order_flow_imbalance_scalper:OrderFlowImbalanceScalper
    enabled: false
    params:
      symbol: XAUUSD
      entry_timeframe: M1
      structure_timeframe: M5
      # OFI proxy — quote-mid shift rule
      ofi_lookback_ticks: 200    # hard cap on the signed-volume deque
      ofi_window_seconds: 60     # drop samples older than this on read
      ofi_threshold: 200         # |signed-volume sum| must exceed this
      # M5 trend filter
      require_m5_trend: true
      ema_fast_period: 20
      ema_slow_period: 50
      # Session + vol gates (reused from MBS winner)
      avoid_hours_utc: [13, 14, 15, 18]
      vol_gate_lookback: 50
      vol_gate_mult: 1.5
      # Risk + sizing — tp_atr_mult 2.0 from MBS round-2 winner
      volume: 0.01
      atr_period: 14
      sl_atr_mult: 1.0
      tp_atr_mult: 2.0
      max_hold_bars_m1: 30
      cooldown_bars_m1: 5
      enable_trailing: false
      trailing_distance_atr: 0.8
      trailing_activate_atr: 0.5
      trailing_point: 0.01
